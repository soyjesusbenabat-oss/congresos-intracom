document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Spline Sans Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"1c8f68c2-6d28-409e-bb9f-5b6ea4249f50\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Spline Sans Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"9626d7c4-561d-4fc2-a230-0a36313ec43a\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   INTRACOM · Congresos — Landing styles\n   Brand: Red #CC0000 · Sky #67C4D9 · Institutional Navy #0B2236\n   Type: Schibsted Grotesk (display) · Hanken Grotesk (text) · Spline Sans Mono (labels)\n   ============================================================ */\n\n:root{\n  /* surfaces — light (default) */\n  --paper:#F5F4EF;\n  --surface:#FFFFFF;\n  --surface-2:#FBFAF6;\n  --ink:#16181B;\n  --muted:#5C6168;\n  --border:#E7E5DD;\n  --border-strong:#D7D4C9;\n\n  /* institutional blue (dark break sections) */\n  --navy:#003871;\n  --navy-2:#0B4A8C;\n  --navy-text:#EAF4F8;\n  --navy-muted:#A8C0D6;\n  --navy-border:rgba(255,255,255,.13);\n\n  /* brand */\n  --blue:#003871;\n  --blue-deep:#012A55;\n  --blue-50:#E8EFF7;\n  --red:#CC0000;\n  --red-600:#AE0000;\n  --red-700:#900000;\n  --red-50:#FBEAEA;\n  --sky:#67C4D9;\n  --sky-deep:#2C8DA6;\n  --sky-50:#EAF6FA;\n\n  /* accent (tweakable) — drives CTAs, key numbers */\n  --accent:var(--red);\n  --accent-600:var(--red-600);\n  --accent-ink:#FFFFFF;\n  --accent-soft:var(--red-50);\n\n  /* type */\n  --font-display:\"Schibsted Grotesk\", system-ui, sans-serif;\n  --font-text:\"Hanken Grotesk\", system-ui, sans-serif;\n  --font-mono:\"Spline Sans Mono\", ui-monospace, monospace;\n\n  --maxw:1200px;\n  --gutter:clamp(20px, 5vw, 56px);\n  --radius:22px;\n  --radius-sm:14px;\n  --shadow:0 1px 2px rgba(16,18,20,.04), 0 18px 40px -24px rgba(16,18,20,.22);\n  --shadow-lg:0 30px 70px -32px rgba(11,34,54,.40);\n  --ring:0 0 0 1px var(--border);\n}\n\n[data-theme=\"dark\"]{\n  --paper:#071E33;\n  --surface:#0C2C49;\n  --surface-2:#09253E;\n  --ink:#EAF4F8;\n  --muted:#A6BECE;\n  --border:#1A3D5C;\n  --border-strong:#244e70;\n  --navy:#021E3C;\n  --navy-2:#073564;\n  --shadow:0 1px 2px rgba(0,0,0,.3), 0 22px 44px -26px rgba(0,0,0,.6);\n  --shadow-lg:0 34px 80px -34px rgba(0,0,0,.7);\n}\n\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\n@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}\nbody{\n  margin:0;\n  font-family:var(--font-text);\n  background:var(--paper);\n  color:var(--ink);\n  -webkit-font-smoothing:antialiased;\n  text-rendering:optimizeLegibility;\n  font-size:17px;\n  line-height:1.6;\n  overflow-x:hidden;\n  transition:background .4s ease, color .4s ease;\n}\nimg{max-width:100%;display:block}\na{color:inherit;text-decoration:none}\nbutton{font-family:inherit}\n::selection{background:var(--accent);color:var(--accent-ink)}\n\n/* ---------- layout primitives ---------- */\n.container{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gutter)}\n.section{padding-block:clamp(72px,11vh,140px);position:relative}\n.section--tight{padding-block:clamp(48px,7vh,84px)}\n.eyebrow{\n  font-family:var(--font-mono);\n  font-size:12px;\n  letter-spacing:.22em;\n  text-transform:uppercase;\n  color:var(--accent);\n  font-weight:500;\n  display:inline-flex;align-items:center;gap:.6em;\n  margin:0 0 18px;\n}\n.eyebrow::before{content:\"\";width:22px;height:1.5px;background:var(--accent);display:inline-block}\n.section-head{max-width:760px;margin-bottom:clamp(40px,6vh,68px)}\n.section-head.center{margin-inline:auto;text-align:center}\n.section-head.center .eyebrow{justify-content:center}\nh1,h2,h3,h4{font-family:var(--font-display);font-weight:700;line-height:1.04;letter-spacing:-.02em;margin:0}\n.h-title{font-size:clamp(30px,4.4vw,54px);font-weight:800;letter-spacing:-.03em;text-wrap:balance}\n.lead{font-size:clamp(17px,1.4vw,20px);color:var(--muted);margin-top:18px;text-wrap:pretty;max-width:62ch}\n\n/* ---------- buttons ---------- */\n.btn{\n  display:inline-flex;align-items:center;justify-content:center;gap:.55em;\n  font-family:var(--font-text);font-weight:600;font-size:16px;\n  padding:15px 26px;border-radius:999px;border:1.5px solid transparent;\n  cursor:pointer;transition:transform .25s cubic-bezier(.2,.7,.3,1),background .25s,box-shadow .25s,color .25s,border-color .25s;\n  white-space:nowrap;\n}\n.btn .arr{transition:transform .3s cubic-bezier(.2,.7,.3,1)}\n.btn:hover .arr{transform:translateX(4px)}\n.btn-primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 12px 24px -12px color-mix(in srgb,var(--accent) 70%,transparent)}\n.btn-primary:hover{background:var(--accent-600);transform:translateY(-2px);box-shadow:0 18px 30px -12px color-mix(in srgb,var(--accent) 70%,transparent)}\n.btn-ghost{background:transparent;color:var(--ink);border-color:var(--border-strong)}\n.btn-ghost:hover{border-color:var(--ink);transform:translateY(-2px)}\n.btn-lg{padding:18px 32px;font-size:17px}\n.on-navy .btn-ghost{color:var(--navy-text);border-color:var(--navy-border)}\n.on-navy .btn-ghost:hover{border-color:var(--navy-text);background:rgba(255,255,255,.06)}\n\n/* ---------- reveal animation ----------\n   Base state is VISIBLE (safe for captures/print/throttled tabs).\n   Only elements scrolled INTO view get .anim, which plays a one-shot\n   entrance from hidden->visible. Anything not animating stays visible. */\n.reveal{opacity:1;transform:none}\n@media (prefers-reduced-motion:no-preference){\n  .reveal.anim{animation:revIn .72s cubic-bezier(.16,.8,.3,1) both}\n}\n@keyframes revIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}\n.reveal.anim[data-d=\"1\"]{animation-delay:.08s}\n.reveal.anim[data-d=\"2\"]{animation-delay:.16s}\n.reveal.anim[data-d=\"3\"]{animation-delay:.24s}\n.reveal.anim[data-d=\"4\"]{animation-delay:.32s}\n.reveal.anim[data-d=\"5\"]{animation-delay:.40s}\n\n/* ============================================================\n   NAV\n   ============================================================ */\n.nav{position:sticky;top:0;z-index:60;transition:background .3s,box-shadow .3s,border-color .3s}\n.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;height:82px}\n.nav.scrolled{background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--border);box-shadow:0 10px 30px -24px rgba(16,18,20,.4)}\n.brand{display:flex;align-items:center;flex-shrink:0}\n.brand img{height:48px;width:auto}\n.brand-text{display:flex;flex-direction:column;line-height:1}\n.brand-text b{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.02em}\n.brand-text span{font-family:var(--font-mono);font-size:8.5px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-top:3px}\n.nav-links{display:flex;align-items:center;gap:2px}\n.nav-links a{font-size:14.5px;font-weight:500;color:var(--muted);padding:9px 11px;border-radius:999px;transition:color .2s,background .2s;white-space:nowrap}\n.nav-links a:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,transparent)}\n.nav-cta{display:flex;align-items:center;gap:10px}\n.nav-toggle{display:none;background:none;border:0;cursor:pointer;padding:8px;color:var(--ink)}\n@media(max-width:980px){\n  .nav-links{position:fixed;inset:82px 0 auto 0;flex-direction:column;align-items:stretch;gap:2px;background:var(--surface);padding:16px var(--gutter) 26px;border-bottom:1px solid var(--border);transform:translateY(-130%);transition:transform .4s cubic-bezier(.2,.7,.3,1);box-shadow:var(--shadow)}\n  .nav-links.open{transform:none}\n  .nav-links a{padding:13px 8px;font-size:17px;border-bottom:1px solid var(--border)}\n  .nav-toggle{display:inline-flex}\n  .nav-cta .btn:not(.nav-toggle){display:none}\n  .brand img{height:40px}\n}\n\n/* ============================================================\n   HERO (S1)\n   ============================================================ */\n.hero{position:relative;overflow:clip;padding-top:clamp(40px,7vh,90px);padding-bottom:clamp(60px,9vh,120px)}\n.hero-bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:clip}\n.hero-blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5}\n.hero-blob.a{width:520px;height:520px;background:radial-gradient(circle,color-mix(in srgb,var(--sky) 70%,transparent),transparent 70%);top:-160px;right:-90px}\n.hero-blob.b{width:460px;height:460px;background:radial-gradient(circle,color-mix(in srgb,var(--red) 32%,transparent),transparent 70%);bottom:-200px;left:-120px}\n.hero-grid-tex{position:absolute;inset:0;background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:62px 62px;opacity:.4;mask-image:radial-gradient(ellipse 80% 70% at 50% 0%,#000,transparent 75%)}\n.hero-inner{position:relative;z-index:2}\n\n/* centered variant (default) */\n.hero-pill{display:inline-flex;align-items:center;gap:9px;font-size:13.5px;font-weight:500;color:var(--muted);background:var(--surface);border:1px solid var(--border);padding:7px 7px 7px 14px;border-radius:999px;box-shadow:var(--shadow);margin-bottom:30px}\n.hero-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--sky-deep);box-shadow:0 0 0 4px color-mix(in srgb,var(--sky) 40%,transparent)}\n.hero-pill .tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.04em;background:var(--accent-soft);color:var(--accent-600);padding:4px 9px;border-radius:999px}\n.hero-title{font-size:clamp(38px,6.4vw,82px);font-weight:800;letter-spacing:-.035em;line-height:.98;text-wrap:balance}\n.hero-title .hl{color:var(--accent);position:relative;white-space:nowrap}\n.hero-sub{font-size:clamp(17px,1.5vw,21px);color:var(--muted);max-width:60ch;margin:26px auto 0;text-wrap:pretty}\n.hero-actions{display:flex;gap:14px;flex-wrap:wrap;margin-top:38px}\n.hero[data-layout=\"centered\"] .hero-inner{text-align:center;max-width:920px;margin-inline:auto;display:flex;flex-direction:column;align-items:center}\n.hero[data-layout=\"centered\"] .hero-visual{margin-top:54px;width:100%}\n\n/* asymmetric variant */\n.hero[data-layout=\"asym\"] .hero-inner{display:grid;grid-template-columns:1.15fr .95fr;gap:clamp(30px,5vw,70px);align-items:center;text-align:left}\n.hero[data-layout=\"asym\"] .hero-title{font-size:clamp(36px,4.9vw,66px)}\n.hero[data-layout=\"asym\"] .hero-sub{margin-inline:0}\n.hero[data-layout=\"asym\"] .hero-actions{justify-content:flex-start}\n.hero[data-layout=\"asym\"] .hero-copy-visual{display:none}\n.hero[data-layout=\"centered\"] .hero-side-visual{display:none}\n\n/* hero proof bar (centered) */\n.hero-proof{display:inline-flex;align-items:stretch;gap:clamp(14px,2.6vw,28px);background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:15px clamp(20px,3vw,30px);box-shadow:var(--shadow)}\n.hero-proof .hp-item{display:flex;align-items:center;gap:11px;text-align:left;font-size:14px;color:var(--muted);line-height:1.28;max-width:18ch}\n.hero-proof .hp-item .hp-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--sky-50);color:var(--sky-deep);flex-shrink:0}\n.hero-proof .hp-item b{color:var(--blue);font-weight:700}\n.hero-proof .hp-sep{width:1px;background:var(--border-strong)}\n\n/* hero blue panel (asymmetric) */\n.hero-panel{position:relative;overflow:hidden;background:linear-gradient(158deg,var(--blue),var(--blue-deep));border:1px solid rgba(103,196,217,.28);border-radius:var(--radius);padding:clamp(26px,3vw,40px);box-shadow:var(--shadow-lg);color:var(--navy-text)}\n.hero-panel::after{content:\"\";position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(103,196,217,.30),transparent 66%);top:-130px;right:-100px;pointer-events:none}\n.hero-panel .hp-tag{display:inline-flex;align-items:center;gap:9px;font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--sky);margin-bottom:24px;position:relative;z-index:2}\n.hero-panel .hp-tag .dot{width:7px;height:7px;border-radius:50%;background:var(--sky);box-shadow:0 0 0 4px rgba(103,196,217,.22)}\n.hero-panel .hp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:relative;z-index:2}\n.hero-panel .hpc{padding:18px;border-radius:15px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09)}\n.hero-panel .hpc b{display:block;font-family:var(--font-display);font-weight:800;font-size:clamp(28px,3vw,40px);letter-spacing:-.035em;line-height:.85;color:var(--sky);margin-bottom:9px}\n.hero-panel .hpc b .sym{font-size:.6em;opacity:.85}\n.hero-panel .hpc span{font-size:13px;color:var(--navy-muted);line-height:1.3}\n@media(max-width:860px){\n  .hero[data-layout=\"asym\"] .hero-inner{grid-template-columns:1fr;text-align:center}\n  .hero[data-layout=\"asym\"] .hero-actions{justify-content:center}\n  .hero[data-layout=\"asym\"] .hero-sub{margin-inline:auto}\n  .hero[data-layout=\"asym\"] .hero-side-visual{display:none}\n  .hero[data-layout=\"asym\"] .hero-copy-visual{display:block;margin-top:46px}\n}\n@media(max-width:460px){\n  .hero-proof{flex-wrap:wrap;justify-content:center;gap:18px}\n  .hero-proof .hp-sep{display:none}\n  .hero-proof .hp-item{flex:1;min-width:84px;align-items:center;text-align:center}\n}\n\n/* placeholder image utility */\n.ph{position:relative;background:\n  repeating-linear-gradient(135deg,color-mix(in srgb,var(--sky) 24%,var(--surface)) 0 11px,color-mix(in srgb,var(--sky) 13%,var(--surface)) 11px 22px);\n  display:grid;place-items:center;color:var(--sky-deep);overflow:hidden}\n.ph[data-tone=\"red\"]{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--red) 16%,var(--surface)) 0 11px,color-mix(in srgb,var(--red) 8%,var(--surface)) 11px 22px);color:var(--red-600)}\n.ph[data-tone=\"navy\"]{background:repeating-linear-gradient(135deg,#0A4A86 0 11px,#073E74 11px 22px);color:var(--sky)}\n.ph .ph-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:6px 12px;border:1px dashed currentColor;border-radius:999px;background:color-mix(in srgb,var(--surface) 55%,transparent);text-align:center;max-width:80%}\n\n/* ============================================================\n   COUNTERS (S2)\n   ============================================================ */\n.stats{background:var(--surface-2);border-block:1px solid var(--border)}\n.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(20px,3vw,40px)}\n.stat{padding:6px 4px}\n.stat .num{font-family:var(--font-display);font-weight:800;font-size:clamp(44px,5.6vw,76px);letter-spacing:-.04em;line-height:1;color:var(--ink);display:flex;align-items:baseline}\n.stat .num .sym{color:var(--accent);font-size:.62em;margin-right:.04em}\n.stat .num .suf{color:var(--accent);font-size:.62em}\n.stat .label{margin-top:12px;font-size:15px;color:var(--muted);font-weight:500;max-width:22ch}\n.stat .bar{height:3px;width:46px;background:var(--accent);border-radius:2px;margin-top:18px;opacity:.85}\n@media(max-width:860px){.stats-grid{grid-template-columns:repeat(2,1fr);gap:34px 22px}}\n@media(max-width:430px){.stats-grid{grid-template-columns:1fr 1fr}}\n\n/* ============================================================\n   LOGO STRIP (S3)\n   ============================================================ */\n.marquee-sec{padding-block:clamp(40px,6vh,72px)}\n.marquee-lead{text-align:center;color:var(--muted);font-size:15px;margin-bottom:32px}\n.marquee{position:relative;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}\n.marquee-track{display:flex;gap:22px;width:max-content;animation:scrollx 44s linear infinite}\n.marquee:hover .marquee-track{animation-play-state:paused}\n@keyframes scrollx{to{transform:translateX(-50%)}}\n.logo-item{flex-shrink:0;width:190px;height:98px;display:flex;align-items:center;justify-content:center;padding:16px 24px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);transition:transform .3s,box-shadow .3s,border-color .3s}\n.logo-item:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--border-strong)}\n.logo-item img{max-width:100%;max-height:60px;width:auto;height:auto;object-fit:contain}\n@media (prefers-reduced-motion:reduce){.marquee-track{animation:none;flex-wrap:wrap;justify-content:center;width:auto;gap:16px}}\n\n/* ============================================================\n   BENEFITS (S4)\n   ============================================================ */\n.benefits-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}\n.benefit{grid-column:span 1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:30px;position:relative;overflow:hidden;transition:transform .35s cubic-bezier(.2,.7,.3,1),box-shadow .35s,border-color .35s}\n.benefit:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--border-strong)}\n.benefit.feat{grid-column:span 1}\n.benefit .b-ic{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;margin-bottom:22px;background:var(--accent-soft);color:var(--accent-600);transition:transform .35s}\n.benefit:hover .b-ic{transform:scale(1.06) rotate(-3deg)}\n.benefit h3{font-size:21px;font-weight:700;letter-spacing:-.01em;margin-bottom:10px}\n.benefit p{color:var(--muted);font-size:15.5px;margin:0}\n.benefit .b-num{position:absolute;top:22px;right:26px;font-family:var(--font-mono);font-size:12px;color:var(--border-strong)}\n@media(max-width:920px){.benefits-grid{grid-template-columns:repeat(2,1fr)}}\n@media(max-width:560px){.benefits-grid{grid-template-columns:1fr}}\n\n/* ============================================================\n   SERVICES (S5) — tabs / accordion\n   ============================================================ */\n.services-layout{display:grid;grid-template-columns:.92fr 1.25fr;gap:clamp(20px,3vw,48px);align-items:start}\n.svc-tabs{display:flex;flex-direction:column;gap:6px;position:sticky;top:96px}\n.svc-tab{display:flex;align-items:center;gap:14px;text-align:left;background:transparent;border:0;border-radius:14px;padding:16px 18px;cursor:pointer;color:var(--muted);transition:background .25s,color .25s;width:100%}\n.svc-tab .t-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);color:var(--ink);flex-shrink:0;transition:all .25s}\n.svc-tab .t-name{font-family:var(--font-display);font-weight:600;font-size:17.5px;letter-spacing:-.01em}\n.svc-tab .t-i{margin-left:auto;opacity:0;transition:opacity .25s,transform .25s;transform:translateX(-6px)}\n.svc-tab:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 4%,transparent)}\n.svc-tab.active{color:var(--ink);background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--border)}\n.svc-tab.active .t-ic{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}\n.svc-tab.active .t-i{opacity:1;transform:none;color:var(--accent)}\n.svc-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:clamp(26px,3vw,42px);min-height:420px;box-shadow:var(--shadow);position:relative;overflow:hidden}\n.svc-content{display:none;animation:fadeUp .5s cubic-bezier(.16,.8,.3,1)}\n.svc-content.show{display:block}\n@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}\n.svc-content .s-no{font-family:var(--font-mono);font-size:12px;letter-spacing:.16em;color:var(--accent);text-transform:uppercase}\n.svc-content h3{font-size:clamp(24px,2.6vw,33px);font-weight:800;letter-spacing:-.02em;margin:14px 0 16px}\n.svc-content .s-desc{color:var(--muted);font-size:17px;max-width:54ch}\n.svc-includes{margin-top:28px;border-top:1px dashed var(--border-strong);padding-top:24px}\n.svc-includes .inc-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:16px}\n.svc-chips{display:flex;flex-wrap:wrap;gap:9px}\n.svc-chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:9px 15px;font-size:14px;font-weight:500}\n.svc-chip svg{color:var(--accent);flex-shrink:0}\n.svc-figure{position:absolute;right:-40px;bottom:-40px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--sky) 40%,transparent),transparent 70%);pointer-events:none}\n/* accordion (mobile) */\n.svc-accordion{display:none}\n.svc-acc-item{border-bottom:1px solid var(--border)}\n.svc-acc-head{display:flex;align-items:center;gap:13px;width:100%;background:none;border:0;padding:20px 4px;cursor:pointer;text-align:left;color:var(--ink)}\n.svc-acc-head .t-ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border);flex-shrink:0}\n.svc-acc-head .t-name{font-family:var(--font-display);font-weight:600;font-size:17px}\n.svc-acc-head .pm{margin-left:auto;transition:transform .3s}\n.svc-acc-item.open .pm{transform:rotate(45deg)}\n.svc-acc-item.open .t-ic{background:var(--accent);color:#fff;border-color:var(--accent)}\n.svc-acc-body{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1)}\n.svc-acc-inner{padding:0 4px -------- */\n#tweaks{position:fixed;right:18px;bottom:18px;z-index:90;width:288px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow-lg);font-family:var(--font-text);transform-origin:bottom right;transition:opacity .3s,transform .3s;overflow:hidden}\n#tweaks.hidden{opacity:0;transform:scale(.9) translateY(10px);pointer-events:none}\n.tw-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}\n.tw-head b{font-family:var(--font-display);font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}\n.tw-head .tw-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}\n.tw-x{background:none;border:0;cursor:pointer;color:var(--muted);padding:4px;border-radius:6px}\n.tw-x:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}\n.tw-body{padding:14px 16px;display:flex;flex-direction:column;gap:18px;max-height:70vh;overflow:auto}\n.tw-group label.tw-lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:9px}\n.tw-seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:3px}\n.tw-seg button{flex:1;background:none;border:0;cursor:pointer;padding:8px 6px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted);transition:all .2s}\n.tw-seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}\n.tw-swatches{display:flex;gap:8px}\n.tw-sw{width:34px;height:34px;border-radius:9px;cursor:pointer;border:2px solid transparent;position:relative;transition:transform .2s}\n.tw-sw:hover{transform:scale(1.08)}\n.tw-sw.on{border-color:var(--ink)}\n.tw-sw.on::after{content:\"\";position:absolute;inset:0;border-radius:7px;border:2px solid var(--surface)}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<!-- ============ NAV ============ -->\n<header class=\"nav\" id=\"nav el contenido científico.<\u002Fp>\n      <div class=\"hero-actions reveal\" data-d=\"3\">\n        <a href=\"#contacto\" class=\"btn btn-primary btn-lg\">Cuéntanos tu congreso <span class=\"arr\">→<\u002Fspan><\u002Fa>\n        <a href=\"#portfolio\" class=\"btn btn-ghost btn-lg\">Ver congresos que hemos organizado<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <!-- proof bar (centered layout) -->\n    <div class=\"hero-visual hero-copy-visual reveal\" data-d=\"4\">\n      <div class=\"hero-proof\">\n        <div class=\"hp-item\"><span class=\"hp-ic\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"m3 12 9 5 9-5M3 7l9 5 9-5-9-5-9 5Z\"><\u002Fpath><\u002Fsvg><\u002Fspan><span>Gestión integral o <b>por servicios<\u002Fb><\u002Fspan><\u002Fdiv>\n        <span class=\"hp-sep\"><\u002Fspan>\n        <div class=\"hp-item\"><span class=\"hp-ic\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"12\" cy=\"7\" r=\"4\"><\u002Fcircle><\u002Fsvg><\u002Fspan><span><b>Un coordinador<\u002Fb> para todo el proceso<\u002Fspan><\u002Fdiv>\n        <span class=\"hp-sep\"><\u002Fspan>\n        <div class=\"hp-item\"><span class=\"hp-ic\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan><span>Primera reunión <b>sin coste<\u002Fb><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <!-- blue panel (asymmetric layout) -->\n    <div class=\"hero-visual hero-side-visual reveal\" data-d=\"2\">\n      <div class=\"hero-panel\">\n        <span class=\"hp-tag\"><span class=\"dot\"><\u002Fspan> Red iberoamericana<\u002Fspan>\n        <div class=\"hp-grid\">\n          <div class=\"hpc\"><b><span class=\"sym\">+<\u002Fspan>50<\u002Fb><span>congresos organizados<\u002Fspan><\u002Fdiv>\n          <div class=\"hpc\"><b><span class=\"sym\">+<\u002Fspan>25<\u002Fb><span>países participantes<\u002Fspan><\u002Fdiv>\n          <div class=\"hpc\"><b><span class=\"sym\">+<\u002Fspan>50<\u002Fb><span>grupos de investigación en red<\u002Fspan><\u002Fdiv>\n          <div class=\"hpc\"><b>1<\u002Fb><span>coordinador para todo el proceso<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ S2 · COUNTERS ============ -->\n<section class=\"section section--tight stats\">\n  <div class=\"container stats-grid\">\n    <div class=\"stat reveal\">\n      <div class=\"num\"><span class=\"sym\">+<\u002Fspan><span data-count=\"50\">0<\u002Fspan><\u002Fdiv>\n      <div class=\"label\">Congresos organizados<\u002Fdiv>\n      <div class=\"bar\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"stat reveal\" data-d=\"1\">\n      <div class=\"num\"><span class=\"sym\">+<\u002Fspan><span data-count=\"25\">0<\u002Fspan><\u002Fdiv>\n      <div class=\"label\">Países participantes<\u002Fdiv>\n      <div class=\"bar\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"stat reveal\" data-d=\"2\">\n      <div class=\"num\"><span class=\"sym\">+<\u002Fspan><span data-count=\"50\">0<\u002Fspan><\u002Fdiv>\n      <div class=\"label\">Grupos de investigación en red<\u002Fdiv>\n      <div class=\"bar\"><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"stat reveal\" data-d=\"3\">\n      <div class=\"num\"><span data-count=\"5\">0<\u002Fspan><\u002Fdiv>\n      <div class=\"label\">Ediciones del Congreso Intracom<\u002Fdiv>\n      <div class=\"bar\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ S3 · LOGO STRIP ============ -->\n<section class=\"section marquee-sec\">\n  <p class=\"marquee-lead reveal\">Universidades, facultades y asociaciones científicas confían en Intracom<\u002Fp>\n  <div class=\"marquee reveal\" data-d=\"1\">\n    <div class=\"marquee-track\" id=\"logoTrack\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ S4 · BENEFITS ============ -->\n<section class=\"section\" id=\"beneficios\">\n  <div class=\"container\">\n    <div class=\"section-head reveal\">\n      <p class=\"eyebrow\">Por qué Intracom<\u002Fp>\n      <h2 class=\"h-title\">¿Por qué organizar tu congreso con Intracom?<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"benefits-grid\">\n      <article class=\"benefit reveal\">\n        <span class=\"b-num\">01<\u002Fspan>\n        <div class=\"b-ic\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9\" cy=\"7\" r=\"4\"><\u002Fcircle><path d=\"M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>Conocemos el mundo académico desde dentro<\u002Fh3>\n        <p>No somos una empresa de eventos externa. Formamos parte de la comunidad universitaria e iberoamericana.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"benefit reveal\" data-d=\"1\">\n        <span class=\"b-num\">02<\u002Fspan>\n        <div class=\"b-ic\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"m12 2 9 5-9 5-9-5 9-5Z\"><\u002Fpath><path d=\"m3 12 9 5 9-5\"><\u002Fpath><path d=\"m3 17 9 5 9-5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>Gestión integral o por servicios<\u002Fh3>\n        <p>Nos adaptamos: puedes contratarnos para todo o solo para lo que necesitas. Sin paquetes rígidos.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"benefit reveal\" data-d=\"2\">\n        <span class=\"b-num\">03<\u002Fspan>\n        <div class=\"b-ic\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10Z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>Tu congreso llega más lejos<\u002Fh3>\n        <p>Difundimos en nuestra red de +50 grupos de investigación y +25 países. Tu evento tiene visibilidad real.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"benefit reveal\" data-d=\"3\">\n        <span class=\"b-num\">04<\u002Fspan>\n        <div class=\"b-ic\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"12\" cy=\"7\" r=\"4\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n        <h3>Un coordinador para todo<\u002Fh3>\n        <p>Un solo interlocutor durante todo el proceso. Sin correos perdidos ni responsabilidades difusas.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"benefit reveal\" data-d=\"4\">\n        <span class=\"b-num\">05<\u002Fspan>\n        <div class=\"b-ic\"><svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><circle cx=\"12\" cy=\"8\" r=\"6\"><\u002Fcircle><path d=\"M15.5 13.5 17 22l-5-3-5 3 1.5-8.5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>Experiencia contrastada<\u002Fh3>\n        <p>Más de 50 congresos organizados en disciplinas y formatos distintos: presencial, virtual e híbrido.<\u002Fp>\n      <\u002Farticle>\n      <article class=\"benefit reveal feat\" data-d=\"5\" style=\"background:var(--navy);border-color:var(--navy);color:var(--navy-text);display:flex;flex-direction:column;justify-content:center\">\n        <h3 style=\"color:#fff;font-size:23px\">¿Hablamos de tu próximo congreso?<\u002Fh3>\n        <p style=\"color:var(--navy-muted);margin-bottom:22px\">La primera reunión es gratuita y sin compromiso.<\u002Fp>\n        <a href=\"#contacto\" class=\"btn btn-primary\" style=\"align-self:flex-start\">Cuéntanos tu congreso <span class=\"arr\">→<\u002Fspan><\u002Fa>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ S5 · SERVICES ============ -->\n<section class=\"section\" id=\"servicios\" style=\"background:var(--surface-2);border-block:1px solid var(--border)\">\n  <div class=\"container\">\n    <div class=\"section-head reveal\">\n      <p class=\"eyebrow\">Servicios<\u002Fp>\n      <h2 class=\"h-title\">Todo lo que necesita tu congreso, en un solo equipo<\u002Fh2>\n      <p class=\"lead\">Puedes contratarnos para la gestión completa o para servicios concretos.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- desktop: tabs -->\n    <div class=\"services-layout\" id=\"svcTabs\"><\u002Fdiv>\n    <!-- mobile: accordion -->\n    <div class=\"svc-accordion\" id=\"svcAccordion\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ S6 · IBEROAMERICAN ============ -->\n<section class=\"section section--navy on-navy\">\n  <div class=\"ibero-glow\"><\u002Fdiv>\n  <div class=\"container\">\n    <div class=\"ibero-grid\">\n      <div class=\"reveal\">\n        <p class=\"eyebrow\">Diferenciador iberoamericano<\u002Fp>\n        <h2 class=\"ibero-title\">No somos solo una empresa de eventos. Somos parte de la comunidad académica.<\u002Fh2>\n        <div class=\"ibero-body\">\n          <p>La diferencia entre Intracom y otras secretarías técnicas no está solo en lo que hacemos, sino en <strong>dónde estamos<\u002Fstrong>.<\u002Fp>\n          <p>Intracom es un portal iberoamericano de transferencia del conocimiento con más de 50 grupos de investigación activos, una revista científica propia y una red social académica en funcionamiento. Cuando organizamos tu congreso, no lo hacemos desde fuera del mundo universitario: <strong>lo hacemos desde dentro<\u002Fstrong>.<\u002Fp>\n          <p>Eso significa que tu congreso llega a investigadores de España, México, Argentina, Colombia, Chile y el resto del espacio iberoamericano. Que la difusión se amplifica a través de una comunidad ya consolidada. Y que el conocimiento generado encuentra el camino hacia publicaciones, colaboraciones y proyectos futuros.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ibero-side reveal\" data-d=\"2\">\n        <div class=\"ibero-photo ph\" data-tone=\"navy\"><span class=\"ph-label\">Foto — congreso Intracom / comunidad académica<\u002Fspan><\u002Fdiv>\n        <div class=\"ibero-figures\">\n          <div class=\"ifig\"><span class=\"ifig-num\"><span class=\"sym\" style=\"font-size:.6em\">+<\u002Fspan><span data-count=\"50\">0<\u002Fspan><\u002Fspan><span class=\"ifig-lab\">grupos de investigación activos en la red<\u002Fspan><\u002Fdiv>\n          <div class=\"ifig\"><span class=\"ifig-num\"><span class=\"sym\" style=\"font-size:.6em\">+<\u002Fspan><span data-count=\"25\">0<\u002Fspan><\u002Fspan><span class=\"ifig-lab\">países iberoamericanos<\u002Fspan><\u002Fdiv>\n          <div class=\"ifig\"><span class=\"ifig-num\"><span class=\"sym\" style=\"font-size:.6em\">+<\u002Fspan><span data-count=\"50\">0<\u002Fspan><\u002Fspan><span class=\"ifig-lab\">congresos organizados<\u002Fspan><\u002Fdiv>\n          <div class=\"ifig\"><span class=\"ifig-num\"><span data-count=\"1\">0<\u002Fspan><\u002Fspan><span class=\"ifig-lab\">revista científica propia con evaluación por pares<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ S7 · PROCESS ============ -->\n<section class=\"section\" id=\"proceso\">\n  <div class=\"container\">\n    <div class=\"section-head reveal\">\n      <p class=\"eyebrow\">Cómo trabajamos<\u002Fp>\n      <h2 class=\"h-title\">Simple. Tú nos cuentas, nosotros nos encargamos.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"process-grid\">\n      <div class=\"pstep reveal\">\n        <div class=\"p-num\">1<\u002Fdiv>\n        <div class=\"p-line\"><\u002Fdiv>\n        <h3>Primera reunión sin coste<\u002Fh3>\n        <p>Nos cuentas el congreso: fe
